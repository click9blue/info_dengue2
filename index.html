<style>

.in{max-width:900px;margin:0 auto}

dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(520px,92vw);padding:0}

</div></dialog>
<script>
/* ===== BANCO COMPARTILHADO (Supabase) =====
   Preencha com os dados do seu projeto (Project Settings > API). A chave "anon/public" PODE ficar no código:
   quem protege os dados são as regras (RLS) do arquivo setup.sql. NUNCA coloque a chave "service_role" aqui.
   Se deixar vazio, o site funciona só no navegador de cada pessoa (modo local, como antes). */
const CFG={url:'',key:''};
const REMOTE=!!(CFG.url&&CFG.key);let SAVED='';
const TOK=()=>{try{return sessionStorage.getItem('dengue-tok')||''}catch(x){return ''}};
async function api(m,path,body,o){o=o||{};const h={apikey:CFG.key,Authorization:'Bearer '+(o.auth?(TOK()||CFG.key):CFG.key),'Content-Type':'application/json'};if(o.prefer)h.Prefer=o.prefer;const r=await fetch(CFG.url.replace(/\/$/,'')+'/rest/v1/'+path,{method:m,headers:h,body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error(r.status);const t=await r.text();return t?JSON.parse(t):null}
const KEY='dengue-site-v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const F={bricolage:"'Bricolage Grotesque',system-ui,sans-serif",fraunces:"'Fraunces',Georgia,serif",system:"system-ui,sans-serif"};

const base=(t,o)=>({id:uid(),t,al:'left',fs:100,pd:56,color:'',bg:'',bgi:'',ov:.35,w:100,off:{},bh:0,imgs:[],...o});
